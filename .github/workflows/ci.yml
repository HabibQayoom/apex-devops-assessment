name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Run the intentional failing test to prove deploy is blocked"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Unit tests
        env:
          RUN_INTENTIONAL_FAILURE: ${{ inputs.simulate_failure && '1' || '0' }}
        run: pytest -v --cov=app --cov-report=term-missing

  build:
    name: Build and scan image
    needs: test            # blocked if tests fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute version tag
        run: echo "VERSION=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build versioned image
        run: docker build --build-arg APP_VERSION="$VERSION" -t "apex-ops-api:$VERSION" .
      - name: Scan image (Trivy, fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: apex-ops-api:${{ env.VERSION }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: Deploy (local Compose smoke deployment)
    needs: build           # blocked if build/scan fails
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic .env
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)/" .env
      - name: Release, deploy, smoke test
        run: |
          V="sha-${GITHUB_SHA::7}"
          scripts/release.sh "$V"
          scripts/deploy.sh "$V"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
